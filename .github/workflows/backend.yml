name: Build APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "arena/**"
    paths-ignore:
      - "supabase/**"
      - "docs/**"
      - "*.md"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      ANDROID_NDK_VERSION: "26.1.10909125"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Expo diagnostics
        run: |
          set -euo pipefail

          echo "Expo version:"
          npx expo --version

          echo "Expo environment:"
          npx expo env:info

          echo "Expo doctor:"
          npx expo-doctor || true

      - name: Generate Android project
        run: |
          set -euxo pipefail

          echo "Generating Android project..."

          npx expo prebuild \
            --platform android \
            --no-install

          echo "Checking generated Android project..."

          test -d android
          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle

          chmod +x android/gradlew

          echo "Android project generated successfully."

      - name: Show Android environment
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Java:"
          java -version

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          echo "Android SDK:"
          ls -la "${ANDROID_SDK_ROOT}" || true

          echo "NDK:"
          ls -la "${ANDROID_SDK_ROOT}/ndk" || true

      - name: Check Gradle
        run: |
          set -euo pipefail

          cd android
          chmod +x gradlew

          ./gradlew --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        run: |
          set -euo pipefail

          cd android
          chmod +x gradlew

          echo "Starting APK build..."

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all

          test -s app/build/outputs/apk/release/app-release.apk

          echo "APK build successful."

      - name: Gradle diagnostics on failure
        if: failure()
        run: |
          set +e

          echo "========================================"
          echo "BUILD FAILURE DIAGNOSTICS"
          echo "========================================"

          echo "Current directory:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "Android directory:"
          if [ -d android ]; then
            find android -maxdepth 3 -type f | head -200

            cd android

            echo "Gradle version:"
            ./gradlew --version || true

            echo "Android configuration:"
            grep -RInE \
              "compileSdk|targetSdk|minSdk|ndkVersion|buildToolsVersion|namespace|applicationId" \
              . \
              --exclude-dir=.gradle \
              --exclude='*.lock' || true
          else
            echo "ERROR: Android directory was NOT generated by Expo."
          fi

          echo "Android SDK:"
          ls -la "${ANDROID_SDK_ROOT}" || true

          echo "APK outputs:"
          find . \
            -path "*/build/outputs/*" \
            -type f \
            -print 2>/dev/null || true

      - name: Prepare APK
        run: |
          set -euo pipefail

          test -s android/app/build/outputs/apk/release/app-release.apk

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            hallyu.apk

          ls -lh hallyu.apk

          echo "APK_SIZE=$(du -h hallyu.apk | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-apk
          path: hallyu.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="apk-${{ github.run_number }}"

          gh release create "$TAG" hallyu.apk \
            --title "Hallyu APK #${{ github.run_number }}" \
            --notes "Installable Android APK (${APK_SIZE}).

          Connected to live Supabase backend via constants/keys.ts.

          Install: download APK → allow unknown apps → open file."
