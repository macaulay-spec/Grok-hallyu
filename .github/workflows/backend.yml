name: Hallyu Backend Health

# Live diagnostics for the Rork-managed backend (Supabase Postgres + Rork Auth).
#
# This workflow is the answer to "is the backend actually reachable, and does the app's contract
# still match it?" It only reads: no migration runs, no schema is created or replaced, no service-role
# credential is used, and no secret value is ever printed (names and verdicts only).
#
# It runs with zero secrets — the client credentials it checks are public, and the checks fall back
# to the committed values. Two optional secrets make it stronger:
#   RORK_TEST_REFRESH_TOKEN  a Rork Auth refresh token for a throwaway account → exercises the real
#                            Rork Auth → JWT → Supabase → RLS path end to end.
#
# Failing loudly is the point: a missing/foreign URL, a rejected key, a missing table or column, a
# missing media bucket, or an RLS leak turns this red with the reason attached.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"   # TEMP: lets this session validate the workflow on its branch; removed before merge
    paths:
      - ".github/workflows/backend.yml"
      - "constants/keys.ts"
      - "lib/supabase.ts"
      - "lib/auth.tsx"
      - "lib/storage.ts"
      - "lib/video.ts"
      - "lib/data/supabaseBackend.ts"
      - "scripts/ci/**"
  schedule:
    # Mondays 06:00 UTC — catches backend drift (a rotated key, a dropped table) before users do.
    - cron: "0 6 * * 1"

concurrency:
  group: backend-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Optional secret overrides; empty means "use the committed public value".
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
  EXPO_PUBLIC_RORK_APP_KEY: ${{ secrets.EXPO_PUBLIC_RORK_APP_KEY }}
  EXPO_PUBLIC_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}
  RORK_TEST_REFRESH_TOKEN: ${{ secrets.RORK_TEST_REFRESH_TOKEN }}

jobs:
  health-check:
    name: Verify Rork backend + client contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Which secrets actually exist? Names only — GitHub masks the values, and this step never
      # prints them. It is how obsolete credentials left over from the old Supabase project,
      # Lovable Cloud and the Rork Worker get identified for manual deletion.
      - name: Inventory configured repository secrets (names only)
        continue-on-error: true
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: node scripts/ci/secret-inventory.mjs

      - name: Validate configuration, credentials, schema contract and RLS
        run: node scripts/ci/backend-health.mjs

      - name: Result
        if: always()
        run: |
          echo "::notice::Backend health finished with status '${{ job.status }}'."
          echo "No schema was created or replaced and no migration was executed."
