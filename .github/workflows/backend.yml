name: Backend (Supabase)

# Hallyu backend deployment
#
# REQUIRED GITHUB REPOSITORY SECRETS:
#   SUPABASE_ACCESS_TOKEN
#   SUPABASE_DB_PASSWORD
#
# OPTIONAL:
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_SENDER
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   EXPO_ACCESS_TOKEN, EXPO_TOKEN
#   TMDB_TOKEN

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Supabase
        type: boolean
        default: true

  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'docs/backend/validate-schema.mjs'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: psmxekrmoltwabefgqpd

permissions:
  contents: read

jobs:
  validate:
    name: Validate schema + functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run migrations in embedded Postgres
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/pgv
          cd /tmp/pgv
          npm init -y >/dev/null
          npm install @electric-sql/pglite@0.3 --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          PGLITE_DIR=/tmp/pgv node docs/backend/validate-schema.mjs | tee /tmp/validate.log
          grep -q "ALL SMOKE TESTS DONE" /tmp/validate.log
          if grep -q "UNEXPECTED" /tmp/validate.log; then
            echo "::error::Unexpected migration validation error detected."
            exit 1
          fi
          echo "Database migration validation passed."

      - name: Install Deno
        shell: bash
        run: |
          set -e
          curl -fsSL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o /tmp/deno.zip
          cd /tmp
          unzip -qo deno.zip
          echo "/tmp" >> "$GITHUB_PATH"

      - name: Type-check Edge Functions
        working-directory: supabase/functions
        shell: bash
        run: |
          set -e
          deno check \
            --config deno.json \
            _shared/http.ts \
            _shared/supabase.ts \
            _shared/tmdb.ts \
            ensure-catalog/index.ts \
            delete-account/index.ts \
            push-dispatch/index.ts \
            orphan-media-sweep/index.ts \
            video-upload/index.ts
          echo "Edge Function type-check passed."

  deploy:
    name: Deploy to Supabase
    needs: validate
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      SUPABASE_PROJECT_REF: psmxekrmoltwabefgqpd
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Supabase credentials
        shell: bash
        run: |
          set -e
          echo "Checking Supabase configuration..."
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF is missing."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing."
            echo "Create the repository secret named exactly: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is missing."
            echo "Create the repository secret named exactly: SUPABASE_DB_PASSWORD"
            exit 1
          fi
          echo "Supabase credentials look present."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        shell: bash
        run: |
          set -e
          supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        shell: bash
        run: |
          set -e
          supabase db push --include-all

      # The Supabase CLI does not push auth redirect URLs, SMTP or OAuth providers from
      # config.toml \u2014 those live behind the Management API. This step applies them so sign-up /
      # password-reset emails and the Google flow are wired to this project by CI, not by hand.
      # It is additive: only the fields we set are touched, and each optional block is skipped
      # unless its secrets exist. No secret value is ever echoed.
      - name: Apply auth config (redirect URLs, SMTP, Google OAuth)
        shell: bash
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Optional override; defaults cover the mobile deep link + the web callback.
          AUTH_REDIRECT_URLS: ${{ vars.AUTH_REDIRECT_URLS }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN missing \u2014 skipping auth config."
            exit 0
          fi
          api="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"
          allow="${AUTH_REDIRECT_URLS:-hallyu://auth/callback,hallyu://*,https://hallyu.app/auth/callback,https://hallyu.app/*,exp://*,http://localhost:*/auth/callback}"
          body=$(jq -n --arg allow "$allow" '{uri_allow_list: $allow}')
          if [ -n "${SMTP_HOST:-}" ] && [ -n "${SMTP_USER:-}" ] && [ -n "${SMTP_PASS:-}" ]; then
            body=$(jq -n --argjson b "$body" \
              --arg host "$SMTP_HOST" --arg port "${SMTP_PORT:-587}" \
              --arg user "$SMTP_USER" --arg pass "$SMTP_PASS" \
              --arg sender "${SMTP_SENDER:-Hallyu}" \
              '$b + {smtp_host:$host, smtp_port:$port, smtp_user:$user, smtp_pass:$pass, smtp_admin_email:$user, smtp_sender_name:$sender}')
            echo "SMTP: applying custom sender."
          else
            echo "SMTP: no SMTP_* secrets \u2014 leaving the project's current mailer untouched."
          fi
          if [ -n "${GOOGLE_CLIENT_ID:-}" ] && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            body=$(jq -n --argjson b "$body" \
              --arg id "$GOOGLE_CLIENT_ID" --arg secret "$GOOGLE_CLIENT_SECRET" \
              '$b + {external_google_enabled:true, external_google_client_id:$id, external_google_secret:$secret}')
            echo "Google OAuth: enabling provider."
          fi
          echo "Applying auth config fields: $(echo "$body" | jq -r 'keys | join(", ")')"
          code=$(curl -sS -o /tmp/authcfg.json -w '%{http_code}' -X PATCH "$api" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$body")
          if [ "$code" != "200" ]; then
            echo "::error::Auth config update failed (HTTP $code)."
            cat /tmp/authcfg.json
            exit 1
          fi
          echo "Auth config applied (HTTP $code)."

      - name: Deploy Edge Functions
        shell: bash
        run: |
          set -e
          supabase functions deploy ensure-catalog --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy push-dispatch --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy orphan-media-sweep --project-ref "$SUPABASE_PROJECT_REF"
          # NOTE: `video-upload` is NOT deployed to this project. It is the broker for the
          # video-storage project (the one that owns the public `videos` bucket) and is deployed
          # there \u2014 see docs/backend/10-video-storage.md and supabase/config.toml. Deploying it
          # here would mint signed URLs into a bucket this project does not have.

      - name: Done
        run: echo "Backend deploy finished."
