name: Backend (Supabase)

# Deploys the Hallyu backend to the Supabase project from CI, so nothing has to run on a laptop:
#   1. validate   — runs every migration in embedded Postgres (PGlite) + type-checks the Edge Functions
#   2. deploy     — supabase db push (migrations) → functions deploy → function secrets → project config (PostgREST
#                   schemas, auth redirect URLs, SMTP) through the Management API → live smoke test
#
# Required GitHub Actions secrets (repo → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   supabase.com/dashboard → account → Access Tokens
#   SUPABASE_DB_PASSWORD    project → Settings → Database → Reset database password
# Optional:
#   SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / SMTP_SENDER   own email sender (Resend / Brevo …)
#   EXPO_ACCESS_TOKEN                                             enhanced push security (expo.dev → Access tokens)
#   TMDB_TOKEN                                                    overrides the TMDB v4 token in constants/keys.ts

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the Supabase project (uncheck to only validate)
        type: boolean
        default: true
  push:
    branches: [main, 'arena/**']
    paths:
      - 'supabase/**'
      - 'docs/backend/validate-schema.mjs'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: psmxekrmoltwabefgqpd

jobs:
  validate:
    name: Validate schema + functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run migrations in embedded Postgres (PGlite)
        run: |
          mkdir -p /tmp/pgv && cd /tmp/pgv && npm init -y >/dev/null && npm i @electric-sql/pglite@0.3 --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          PGLITE_DIR=/tmp/pgv node docs/backend/validate-schema.mjs | tee /tmp/validate.log
          grep -q "ALL SMOKE TESTS DONE" /tmp/validate.log
          ! grep -q "UNEXPECTED" /tmp/validate.log

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        working-directory: supabase/functions
        run: deno check --config deno.json ensure-catalog/index.ts delete-account/index.ts push-dispatch/index.ts

  deploy:
    name: Deploy to Supabase
    needs: validate
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing — add them under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations
        run: supabase db push --include-all

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Set function secrets
        env:
          TMDB_TOKEN_SECRET: ${{ secrets.TMDB_TOKEN }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: |
          # TMDB v4 token: the repo secret if present, otherwise the (public, read-only) token shipped in the app
          TMDB="${TMDB_TOKEN_SECRET:-$(grep -oE "'eyJ[^']+'" constants/keys.ts | head -1 | tr -d "'")}"
          args=("TMDB_TOKEN=$TMDB")
          [ -n "$EXPO_ACCESS_TOKEN" ] && args+=("EXPO_ACCESS_TOKEN=$EXPO_ACCESS_TOKEN")
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"

      - name: Configure PostgREST (expose schema api only)
        run: |
          code=$(curl -sS -o /tmp/pg.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"db_schema":"api, graphql_public","db_extra_search_path":"public, extensions","max_rows":1000}')
          echo "postgrest config: HTTP $code"; cat /tmp/pg.json; echo
          [ "$code" = "200" ]

      - name: Configure Auth (redirects, email)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
        run: |
          allow="hallyu://auth/callback,hallyu://**,https://hallyu.app/**,exp://**,http://localhost:*/**,https://*.e2b.app/**"
          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ] && [ -n "$SMTP_SENDER" ]; then
            echo "SMTP secrets found → custom sender + email confirmation ON"
            body=$(jq -n --arg site "https://hallyu.app" --arg allow "$allow" --arg host "$SMTP_HOST" --argjson port "${SMTP_PORT:-587}" \
              --arg user "$SMTP_USER" --arg pass "$SMTP_PASS" --arg sender "$SMTP_SENDER" \
              '{site_url:$site, uri_allow_list:$allow, mailer_autoconfirm:false, smtp_host:$host, smtp_port:$port, smtp_user:$user, smtp_pass:$pass,
                smtp_admin_email:$sender, smtp_sender_name:"Hallyu", smtp_max_frequency:60, external_email_enabled:true}')
          else
            echo "::warning::No SMTP secrets — sign-ups are auto-confirmed and password-reset emails will not be delivered until SMTP_* secrets are added."
            body=$(jq -n --arg site "https://hallyu.app" --arg allow "$allow" '{site_url:$site, uri_allow_list:$allow, mailer_autoconfirm:true, external_email_enabled:true}')
          fi
          code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          echo "auth config: HTTP $code"; jq 'del(.smtp_pass)' /tmp/auth.json 2>/dev/null || cat /tmp/auth.json
          [ "$code" = "200" ]

      - name: Smoke test (public RPC through PostgREST)
        run: |
          ANON=$(grep -oE "'sb_publishable_[^']+'" constants/keys.ts | head -1 | tr -d "'")
          sleep 5
          code=$(curl -sS -o /tmp/rails.json -w '%{http_code}' -X POST "https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/rpc/home_rails" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "Content-Type: application/json" -H "Accept-Profile: api" -H "Content-Profile: api" -d '{}')
          echo "home_rails: HTTP $code"; head -c 400 /tmp/rails.json; echo
          [ "$code" = "200" ]
          code=$(curl -sS -o /tmp/cfg.json -w '%{http_code}' "https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/app_config?select=key,value" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "Accept-Profile: api")
          echo "app_config: HTTP $code"; cat /tmp/cfg.json; echo
          [ "$code" = "200" ]
