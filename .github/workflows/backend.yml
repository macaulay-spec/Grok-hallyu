name: Backend (Supabase)

# Hallyu backend deployment
#
# REQUIRED GITHUB REPOSITORY SECRETS:
#   SUPABASE_ACCESS_TOKEN
#   SUPABASE_DB_PASSWORD
#
# OPTIONAL:
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_SENDER
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   EXPO_ACCESS_TOKEN, EXPO_TOKEN
#   TMDB_TOKEN

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Supabase
        type: boolean
        default: true

  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'docs/backend/validate-schema.mjs'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: psmxekrmoltwabefgqpd

permissions:
  contents: read

jobs:
  validate:
    name: Validate schema + functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run migrations in embedded Postgres
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/pgv
          cd /tmp/pgv
          npm init -y >/dev/null
          npm install @electric-sql/pglite@0.3 --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          PGLITE_DIR=/tmp/pgv node docs/backend/validate-schema.mjs | tee /tmp/validate.log
          grep -q "ALL SMOKE TESTS DONE" /tmp/validate.log
          if grep -q "UNEXPECTED" /tmp/validate.log; then
            echo "::error::Unexpected migration validation error detected."
            exit 1
          fi
          echo "Database migration validation passed."

      - name: Install Deno
        shell: bash
        run: |
          set -e
          curl -fsSL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o /tmp/deno.zip
          cd /tmp
          unzip -qo deno.zip
          echo "/tmp" >> "$GITHUB_PATH"

      - name: Type-check Edge Functions
        working-directory: supabase/functions
        shell: bash
        run: |
          set -e
          deno check \
            --config deno.json \
            _shared/http.ts \
            _shared/supabase.ts \
            _shared/tmdb.ts \
            ensure-catalog/index.ts \
            delete-account/index.ts \
            push-dispatch/index.ts \
            orphan-media-sweep/index.ts \
            video-upload/index.ts
          echo "Edge Function type-check passed."

  deploy:
    name: Deploy to Supabase
    needs: validate
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      SUPABASE_PROJECT_REF: psmxekrmoltwabefgqpd
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Supabase credentials
        shell: bash
        run: |
          set -e
          echo "Checking Supabase configuration..."
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF is missing."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing."
            echo "Create the repository secret named exactly: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is missing."
            echo "Create the repository secret named exactly: SUPABASE_DB_PASSWORD"
            exit 1
          fi
          echo "Supabase credentials look present."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        shell: bash
        run: |
          set -e
          supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        shell: bash
        run: |
          set -e
          supabase db push --include-all

      - name: Deploy Edge Functions
        shell: bash
        run: |
          set -e
          supabase functions deploy ensure-catalog --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy push-dispatch --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy orphan-media-sweep --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy video-upload --project-ref "$SUPABASE_PROJECT_REF"

      - name: Done
        run: echo "Backend deploy finished."
