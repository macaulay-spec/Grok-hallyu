name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths-ignore:
      - "supabase/**"
      - "docs/**"
      - "*.md"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      ANDROID_NDK_VERSION: "26.1.10909125"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Expo prebuild
        run: |
          set -euo pipefail

          npx expo prebuild \
            --platform android \
            --clean \
            --no-install

          echo "===== Android directory ====="
          test -d android
          find android -maxdepth 2 -type f | head -100

      - name: Verify generated Android project
        run: |
          set -euo pipefail

          test -d android
          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle

          chmod +x android/gradlew

      - name: Show Android tool versions
        run: |
          set -euo pipefail

          cd android

          ./gradlew --version

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          ls -la "$ANDROID_SDK_ROOT/ndk" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        run: |
          set -euo pipefail

          cd android

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all

          test -s app/build/outputs/apk/release/app-release.apk

      - name: Print Gradle diagnostics on failure
        if: failure()
        run: |
          set +e

          echo "===== Repository ====="
          pwd
          ls -la

          echo "===== Android directory ====="
          if [ -d android ]; then
            find android -maxdepth 3 -type f | head -200

            cd android

            echo "===== Gradle ====="
            ./gradlew --version || true

            echo "===== Android configuration ====="
            grep -RInE \
              "compileSdk|targetSdk|minSdk|ndkVersion|buildToolsVersion|namespace|applicationId" \
              . \
              --exclude-dir=.gradle \
              --exclude='*.lock' || true
          else
            echo "ERROR: android directory does not exist."
          fi

          echo "===== Installed Android SDK ====="
          sdkmanager --list_installed || true

          echo "===== APK outputs ====="
          find . -path "*/build/outputs/*" -type f -print 2>/dev/null || true

      - name: Prepare artifact
        run: |
          set -euo pipefail

          test -s android/app/build/outputs/apk/release/app-release.apk

          cp android/app/build/outputs/apk/release/app-release.apk hallyu.apk

          ls -lh hallyu.apk

          echo "APK_SIZE=$(du -h hallyu.apk | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-apk
          path: hallyu.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="apk-${{ github.run_number }}"

          gh release create "$TAG" hallyu.apk \
            --title "Hallyu APK #${{ github.run_number }}" \
            --notes "Installable Android APK (${APK_SIZE}).

          Connected to live Supabase backend via constants/keys.ts.

          Install: download APK → allow unknown apps → open file."
