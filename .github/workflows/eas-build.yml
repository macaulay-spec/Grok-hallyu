name: EAS Build (Expo)

# Builds installable apps on Expo Application Services from CI — no phone, laptop or Android Studio needed.
#   preview     → signed Android .apk you can sideload (Internal distribution)
#   production  → Android .aab for the Play Store (and iOS when an Apple account is linked)
#
# Required GitHub Actions secrets:
#   EXPO_ACCESS_TOKEN   expo.dev → Account Settings → Access tokens (scope: Full access)
# Optional (recommended — pins the build to one Expo project):
#   EAS_PROJECT_ID      the projectId EAS created for "hallyu" (printed by the first run, or expo.dev → project settings)
#
# On the first run, if EAS_PROJECT_ID is not set, the job creates the Expo project automatically
# (needs EXPO_ACCESS_TOKEN) and prints the new projectId in the run summary — add it as a secret then.
# Credentials (Android keystore / google-services.json for FCM) are stored remotely by EAS; run
# `eas credentials` once anywhere if you want to add FCM push or bring your own keystore.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [android, ios, both]
        default: android
      profile:
        description: Build profile (eas.json)
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    name: eas build (${{ inputs.platform }} · ${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      CI: 1
    steps:
      - uses: actions/checkout@v4

      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_ACCESS_TOKEN secret is missing — create one at expo.dev → Account Settings → Access tokens and add it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure an Expo project exists (writes extra.eas.projectId)
        run: |
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "EAS_PROJECT_ID secret not set — letting eas create/attach the project…"
            npx eas-cli@latest init --non-interactive --force
            pid=$(node -e "const j=require('./app.json');const id=j.expo&&j.expo.extra&&j.expo.extra.eas&&j.expo.extra.eas.projectId;if(!id){process.exit(1)}console.log(id)")
            echo "EAS_PROJECT_ID=$pid" >> "$GITHUB_ENV"
            {
              echo "### New Expo project"
              echo "projectId: \`$pid\` — add it as repository secret \`EAS_PROJECT_ID\` so future builds skip this step."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('app.json','utf8'));
            j.expo.extra=j.expo.extra||{}; j.expo.extra.eas={...(j.expo.extra.eas||{}), projectId: process.env.EAS_PROJECT_ID};
            fs.writeFileSync('app.json', JSON.stringify(j,null,2)+'\n');
            console.log('pinned projectId', process.env.EAS_PROJECT_ID);
            "
          fi

      - name: Build Android
        if: ${{ inputs.platform != 'ios' }}
        run: npx eas-cli@latest build --platform android --profile "${{ inputs.profile }}" --non-interactive

      - name: Build iOS
        if: ${{ inputs.platform != 'android' }}
        run: npx eas-cli@latest build --platform ios --profile "${{ inputs.profile }}" --non-interactive

      - name: Report build links
        if: always()
        run: |
          echo "## EAS build links" >> "$GITHUB_STEP_SUMMARY"
          npx eas-cli@latest build:list --platform android --limit 1 --non-interactive --json 2>/dev/null \\
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const b=JSON.parse(s)[0];if(b){console.log('- Android:',b.profile?.name,b.artifacts?.buildUrl??b.url,'[details]('+b.url+')')}}catch{}})" >> "$GITHUB_STEP_SUMMARY" || true
          npx eas-cli@latest build:list --platform ios --limit 1 --non-interactive --json 2>/dev/null \\
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const b=JSON.parse(s)[0];if(b){console.log('- iOS:',b.profile?.name,b.artifacts?.buildUrl??'','[details]('+b.url+')')}}catch{}})" >> "$GITHUB_STEP_SUMMARY" || true
          cat "$GITHUB_STEP_SUMMARY"
