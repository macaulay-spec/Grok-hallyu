name: TEMP backend probe (removed before merge)

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: RPC existence discriminator (no side effects)
        env:
          K: sb_publishable_k-MC7g7Wn-jXFtmki2DDGg_LuMOS8la
          U: https://mwgmzncsitgibbkhsktt.supabase.co
        run: |
          set -uo pipefail
          # Wrong-typed arguments: PostgREST resolves the function, then fails to cast the value, so
          # the body never runs. A missing function answers PGRST202 instead.
          post() {
            local label="$1" fn="$2" body="$3" s
            s=$(curl -sS -o /tmp/b -w "%{http_code}" --max-time 25 -X POST \
              -H "apikey: $K" -H "Content-Type: application/json" -d "$body" \
              "$U/rest/v1/rpc/$fn" 2>/dev/null)
            printf '%s=%s(%s) ' "$label" "$s" "$(head -c 110 /tmp/b | tr -d '\r' | tr '\n' ' ')"
          }
          R=""
          R="$R$(post react 'react' '{"p_target_id":12345,"p_kind":{"bad":true},"p_is_comment":"nope"}')"
          R="$R$(post merge_prefs 'merge_prefs' '{"p_data":[1,2,3]}')"
          R="$R$(post merge_onboarding 'merge_onboarding' '{"p_data":"not-json"}')"
          R="$R$(post delete_account 'delete_account' '{}')"
          R="$R$(post missing 'hallyu_missing_fn_xyz' '{"p_data":"x"}')"
          echo "::warning title=rpc_discriminator::$R"

      - name: Storage bucket visibility for a publishable key
        env:
          K: sb_publishable_k-MC7g7Wn-jXFtmki2DDGg_LuMOS8la
          U: https://mwgmzncsitgibbkhsktt.supabase.co
        run: |
          set -uo pipefail
          s=$(curl -sS -o /tmp/b -w "%{http_code}" --max-time 20 -H "apikey: $K" "$U/storage/v1/bucket" 2>/dev/null)
          echo "::warning title=storage_list::$s :: $(head -c 120 /tmp/b | tr -d '\r' | tr '\n' ' ')"
          s=$(curl -sS -o /tmp/b -w "%{http_code}" --max-time 20 -H "apikey: $K" "$U/storage/v1/object/media/.probe" 2>/dev/null)
          echo "::warning title=storage_auth_object::$s :: $(head -c 140 /tmp/b | tr -d '\r' | tr '\n' ' ')"
