name: Hallyu Backend Health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend.yml"
      - "lib/supabase.ts"
      - "lib/auth.tsx"
      - "lib/data/supabaseBackend.ts"
      - "constants/keys.ts"

permissions:
  contents: read

env:
  SUPABASE_URL: "https://mwgmzncsitgibbkhsktt.supabase.co"
  RORK_AUTH_URL: "https://api.rork.com"
  RORK_PROJECT_ID: "ss819xdajyzsa3znsyi9t"

jobs:
  health-check:
    name: Verify Rork Backend Connection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required connection configuration
        env:
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          RORK_APP_KEY: ${{ secrets.EXPO_PUBLIC_RORK_APP_KEY }}
          PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}
        run: |
          set -euo pipefail

          test -n "${SUPABASE_ANON_KEY}" || {
            echo "::error::Missing GitHub secret EXPO_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          }

          test -n "${RORK_APP_KEY}" || {
            echo "::error::Missing GitHub secret EXPO_PUBLIC_RORK_APP_KEY"
            exit 1
          }

          if [ -n "${PROJECT_ID}" ] && [ "${PROJECT_ID}" != "${RORK_PROJECT_ID}" ]; then
            echo "::error::EXPO_PUBLIC_PROJECT_ID does not match the Hallyu Rork project."
            exit 1
          fi

          echo "Supabase target: ${SUPABASE_URL}"
          echo "Rork Auth target: ${RORK_AUTH_URL}"
          echo "Rork project ID: ${RORK_PROJECT_ID}"
          echo "Required credentials: present"

      - name: Verify Supabase endpoint and key
        env:
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          status="$(curl -sS \
            -o /tmp/supabase-root.json \
            -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/")"

          echo "Supabase REST status: ${status}"

          case "${status}" in
            2*|3*)
              echo "Supabase endpoint is reachable."
              ;;
            *)
              echo "::error::Supabase endpoint/key check failed with HTTP ${status}"
              cat /tmp/supabase-root.json || true
              exit 1
              ;;
          esac

      - name: Verify Rork Auth endpoint
        run: |
          set -euo pipefail

          status="$(curl -sS \
            -o /tmp/rork-auth.json \
            -w "%{http_code}" \
            "${RORK_AUTH_URL}/")"

          echo "Rork Auth status: ${status}"

          if [ "${status}" = "000" ]; then
            echo "::error::Cannot reach Rork Auth at ${RORK_AUTH_URL}"
            exit 1
          fi

          echo "Rork Auth endpoint is reachable."

      - name: Verify expected backend resources
        env:
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          check_resource() {
            local resource="$1"
            local status

            status="$(curl -sS \
              -o "/tmp/${resource}.json" \
              -w "%{http_code}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Accept-Profile: public" \
              "${SUPABASE_URL}/rest/v1/${resource}?select=*&limit=1")"

            echo "${resource}: HTTP ${status}"

            case "${status}" in
              200|206|400|401|403)
                ;;
              *)
                echo "::error::Unexpected HTTP ${status} for ${resource}"
                cat "/tmp/${resource}.json" || true
                exit 1
                ;;
            esac
          }

          check_resource profiles
          check_resource posts
          check_resource reactions
          check_resource prefs

          echo "Expected backend resources are reachable."

      - name: Verify client/backend contract
        run: |
          set -euo pipefail

          grep -q "mwgmzncsitgibbkhsktt.supabase.co" constants/keys.ts || {
            echo "::error::constants/keys.ts does not target the expected Rork Supabase backend."
            exit 1
          }

          grep -q "setAccessTokenProvider" lib/auth.tsx || {
            echo "::error::Rork Auth token provider is not wired into Supabase."
            exit 1
          }

          grep -q "accessToken:" lib/supabase.ts || {
            echo "::error::Supabase is missing the Rork JWT access-token bridge."
            exit 1
          }

          grep -q "RORK_APP_KEY" lib/auth.tsx || {
            echo "::error::Rork Auth app key is not wired into auth.tsx."
            exit 1
          }

          echo "Client/backend contract checks passed."

      - name: Final backend status
        run: |
          echo "=========================================="
          echo "HALLYU RORK BACKEND HEALTH CHECK PASSED"
          echo "=========================================="
          echo "Target: ${SUPABASE_URL}"
          echo "Auth:   ${RORK_AUTH_URL}"
          echo "Project: ${RORK_PROJECT_ID}"
          echo ""
          echo "No schema was created or replaced."
          echo "No migrations were executed."
          echo "No service-role credentials were exposed."
