name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths-ignore:
      - "supabase/**"
      - "docs/**"
      - "*.md"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"

      # Android build compatibility
      ANDROID_NDK_VERSION: "26.1.10909125"

      # ============================================================
      # LIVE BACKEND: LOVABLE CLOUD
      # These are injected at Expo build time so they are bundled
      # into the release APK.
      # ============================================================
      EXPO_PUBLIC_LOVABLE_CLOUD_URL: ${{ secrets.LOVABLE_CLOUD_URL }}
      EXPO_PUBLIC_LOVABLE_CLOUD_ANON_KEY: ${{ secrets.LOVABLE_CLOUD_ANON_KEY }}

      # ============================================================
      # TMDB
      # Used directly by the app for catalog discovery.
      # ============================================================
      EXPO_PUBLIC_TMDB_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_ACCESS_TOKEN }}
      EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # NODE
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================================
      # BUN
      # ============================================================
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ============================================================
      # JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ============================================================
      # TYPECHECK
      # ============================================================
      - name: Typecheck
        run: npm run typecheck

      # ============================================================
      # EXPO PREBUILD
      # ============================================================
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      # ============================================================
      # VERIFY GENERATED ANDROID PROJECT
      # ============================================================
      - name: Verify generated Android project
        run: |
          set -euo pipefail

          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/build.gradle

      # ============================================================
      # ANDROID TOOL VERSIONS
      # ============================================================
      - name: Show Android tool versions
        working-directory: android
        run: |
          ./gradlew --version

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          ls -la "$ANDROID_SDK_ROOT/ndk" || true

      # ============================================================
      # GRADLE CACHE
      # ============================================================
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ============================================================
      # RELEASE APK BUILD
      # ============================================================
      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4g
            -Dorg.gradle.daemon=false
            -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all

          test -f app/build/outputs/apk/release/app-release.apk

      # ============================================================
      # APK INSTALL / SIGNATURE / BUNDLE VERIFICATION
      # ============================================================
      - name: Verify release APK (install-safety)
        working-directory: android
        run: |
          set -euo pipefail

          APK=app/build/outputs/apk/release/app-release.apk
          BT="${ANDROID_SDK_ROOT}/build-tools/34.0.0"

          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

          echo "— zipalign (4-byte) —"
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          echo "zipalign: OK"

          echo "— signature (v1 + v2) —"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -3

          echo "— embedded JS bundle —"
          unzip -l "$APK" | grep -q "assets/index.android.bundle" || {
            echo "::error::assets/index.android.bundle missing — the app would white-screen on launch."
            exit 1
          }

          echo "JS bundle: present"

          echo "— manifest sanity (package / sdk / launcher) —"
          "$BT/aapt2" dump badging "$APK" |
            grep -E "package:|sdkVersion|targetSdkVersion|launchable-activity" |
            head -6

          echo "APK install-safety verification passed."

      # ============================================================
      # KVM
      # ============================================================
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      # ============================================================
      # EMULATOR BOOT TEST
      # ============================================================
      - name: Verify release APK boot on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh scripts/ci/boot-check.sh

      # ============================================================
      # BOOT LOG ARTIFACT
      # ============================================================
      - name: Upload emulator boot logcat artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logcat
          path: |
            logcat-errors.txt
            logcat-full.txt
            logcat-boot-trail.txt
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # GRADLE DIAGNOSTICS
      # ============================================================
      - name: Print Gradle diagnostics on failure
        if: failure()
        working-directory: android
        run: |
          echo "Gradle version:"
          ./gradlew --version || true

          echo "Generated Android configuration:"
          grep -RInE \
            "compileSdk|targetSdk|minSdk|ndkVersion|buildToolsVersion" \
            . \
            --exclude-dir=.gradle \
            --exclude='*.lock' || true

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed || true

      # ============================================================
      # PREPARE APK ARTIFACT
      # ============================================================
      - name: Prepare artifact
        run: |
          set -euo pipefail

          cp android/app/build/outputs/apk/release/app-release.apk hallyu.apk

          ls -lh hallyu.apk

          echo "APK_SIZE=$(du -h hallyu.apk | cut -f1)" >> "$GITHUB_ENV"

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-apk
          path: hallyu.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # GITHUB RELEASE
      # ============================================================
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="apk-${{ github.run_number }}"

          gh release create "$TAG" hallyu.apk \
            --title "Hallyu APK #${{ github.run_number }}" \
            --notes "Installable Android APK (${APK_SIZE}).

          Connected to Lovable Cloud backend.

          Install: download APK → allow unknown apps → open file."
