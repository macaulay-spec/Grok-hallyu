name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths-ignore:
      - "supabase/**"
      - "docs/**"
      - "*.md"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      # Expo SDK 51 / React Native 0.74 compatible NDK.
      ANDROID_NDK_VERSION: "26.1.10909125"
      # Optional build-time overrides for the backend endpoints. Empty secrets are ignored by
      # constants/keys.ts (which keeps its built-in defaults), so the APK still connects to the
      # live backend when these are unset.
      # NOTE: Firebase is the primary backend and needs NO secrets here — its client config is
      # public by design (firebase-applet-config.json; security lives in firestore/storage rules).
      # The Supabase variables below feed the LEGACY recovery adapter only (lib/supabase.ts).
      EXPO_PUBLIC_HALYU_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_HALYU_SUPABASE_URL }}
      EXPO_PUBLIC_HALYU_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_HALYU_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_TMDB_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_ACCESS_TOKEN }}
      EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
      # Backend #3: legacy video-storage bucket, READ-only now (videoUrl() resolves pre-migration
      # media keys). Uploads go to Firebase Storage (lib/video.ts) — no broker involved.
      EXPO_PUBLIC_BACKEND_3_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_3_URL }}
      EXPO_PUBLIC_BACKEND_3_ANON_KEY: ${{ secrets.EXPO_PUBLIC_BACKEND_3_ANON_KEY }}
      # Native Google sign-in OAuth clients (optional until provisioned in Google Cloud Console:
      # Android client = package com.hallyu.app + signing SHA-1). Unset → the app shows a clear
      # "Google sign-in is not configured" error; email auth works regardless (lib/googleAuth.ts).
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: setup-android splits `packages` on SPACES, not newlines.
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Backend unit tests (pure logic + architecture invariants)
        run: node scripts/test-firebase-backend.mjs

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify generated Android project
        run: |
          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/build.gradle

      - name: Show Android tool versions
        working-directory: android
        run: |
          ./gradlew --version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls -la "$ANDROID_SDK_ROOT/ndk" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4g
            -Dorg.gradle.daemon=false
            -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all

          test -f app/build/outputs/apk/release/app-release.apk

      # Fail the build here — before the APK is uploaded or released — if it would not install or
      # launch cleanly. Catches the classic release-APK regressions: an unaligned zip (INSTALL_FAILED),
      # a missing/broken signature (Android 7+ requires v2), and a missing JS bundle (white screen on
      # launch). Uses the build-tools that were installed above; nothing here touches signing keys.
      - name: Verify release APK (install-safety)
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BT="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

          echo "— zipalign (4-byte) —"
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          echo "zipalign: OK"

          echo "— signature (v1 + v2) —"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -3

          echo "— embedded JS bundle —"
          unzip -l "$APK" | grep -q "assets/index.android.bundle" || {
            echo "::error::assets/index.android.bundle missing — the app would white-screen on launch."
            exit 1
          }
          echo "JS bundle: present"

          echo "— manifest sanity (package / sdk / launcher) —"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|launchable-activity" | head -6

          echo "APK install-safety verification passed."

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      # Automated emulator boot check: verifies the release APK installs and cold-starts on a
      # clean Android environment, AND — via the app's own logcat traces — that startup completes:
      #   * "[hallyu:boot] index:redirect" must appear within ~60s (splash left, routed),
      #   * "[hallyu:crash]" (global trap firing), "Attempted to navigate before mounting" and
      #     "index:nav-failed" must NOT appear (a swallowed JS error = failed build),
      #   * no FATAL EXCEPTION / ANR.
      # Hard gate (no continue-on-error): if this step is red, the APK is broken. Period.
      #
      # The logic lives in scripts/ci/boot-check.sh and is invoked as ONE command, because this
      # action splits a multi-line `script:` input line-by-line into separate `sh -c` processes
      # (src/script-parser.ts) — inline functions/if/while blocks get shredded (that was the
      # historical exit-127 "note: not found" and exit-2 stray-"fi" gate failures). NEVER move
      # shell logic back inline here.
      - name: Verify release APK boot on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh scripts/ci/boot-check.sh

      - name: Upload emulator boot logcat artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logcat
          path: |
            logcat-errors.txt
            logcat-full.txt
            logcat-boot-trail.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Print Gradle diagnostics on failure
        if: failure()
        working-directory: android
        run: |
          echo "Gradle version:"
          ./gradlew --version || true

          echo "Generated Android configuration:"
          grep -RInE \
            "compileSdk|targetSdk|minSdk|ndkVersion|buildToolsVersion" \
            . \
            --exclude-dir=.gradle \
            --exclude='*.lock' || true

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed || true

      - name: Prepare artifact
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk hallyu.apk
          ls -lh hallyu.apk
          echo "APK_SIZE=$(du -h hallyu.apk | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-apk
          path: hallyu.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="apk-${{ github.run_number }}"

          gh release create "$TAG" hallyu.apk \
            --title "Hallyu APK #${{ github.run_number }}" \
            --notes "Installable Android APK (${APK_SIZE}).

          Connected to live Supabase backend via constants/keys.ts.

          Install: download APK → allow unknown apps → open file."
