name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths-ignore:
      - "supabase/**"
      - "docs/**"
      - "*.md"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      # Expo SDK 51 / React Native 0.74 compatible NDK.
      ANDROID_NDK_VERSION: "26.1.10909125"
      # Optional build-time overrides for the backend endpoints. Empty secrets are ignored by
      # constants/keys.ts (which keeps its built-in defaults), so the APK still connects to the
      # live backend when these are unset.
      # NOTE: Firebase is the primary backend and needs NO secrets here — its client config is
      # public by design (firebase-applet-config.json; security lives in firestore/storage rules).
      # The Supabase variables below feed the LEGACY recovery adapter only (lib/supabase.ts).
      EXPO_PUBLIC_HALYU_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_HALYU_SUPABASE_URL }}
      EXPO_PUBLIC_HALYU_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_HALYU_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_TMDB_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_ACCESS_TOKEN }}
      EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
      # Backend #3: legacy video-storage bucket, READ-only now (videoUrl() resolves pre-migration
      # media keys). Uploads go to Firebase Storage (lib/video.ts) — no broker involved.
      EXPO_PUBLIC_BACKEND_3_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_3_URL }}
      EXPO_PUBLIC_BACKEND_3_ANON_KEY: ${{ secrets.EXPO_PUBLIC_BACKEND_3_ANON_KEY }}
      # Native Google sign-in OAuth clients (optional until provisioned in Google Cloud Console:
      # Android client = package com.hallyu.app + signing SHA-1). Unset → the app shows a clear
      # "Google sign-in is not configured" error; email auth works regardless (lib/googleAuth.ts).
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: setup-android splits `packages` on SPACES, not newlines.
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Backend unit tests (pure logic + architecture invariants)
        run: node scripts/test-firebase-backend.mjs

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify generated Android project
        run: |
          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/build.gradle

      - name: Show Android tool versions
        working-directory: android
        run: |
          ./gradlew --version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls -la "$ANDROID_SDK_ROOT/ndk" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4g
            -Dorg.gradle.daemon=false
            -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all

          test -f app/build/outputs/apk/release/app-release.apk

      # Fail the build here — before the APK is uploaded or released — if it would not install or
      # launch cleanly. Catches the classic release-APK regressions: an unaligned zip (INSTALL_FAILED),
      # a missing/broken signature (Android 7+ requires v2), and a missing JS bundle (white screen on
      # launch). Uses the build-tools that were installed above; nothing here touches signing keys.
      - name: Verify release APK (install-safety)
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BT="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

          echo "— zipalign (4-byte) —"
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          echo "zipalign: OK"

          echo "— signature (v1 + v2) —"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -3

          echo "— embedded JS bundle —"
          unzip -l "$APK" | grep -q "assets/index.android.bundle" || {
            echo "::error::assets/index.android.bundle missing — the app would white-screen on launch."
            exit 1
          }
          echo "JS bundle: present"

          echo "— manifest sanity (package / sdk / launcher) —"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|launchable-activity" | head -6

          echo "APK install-safety verification passed."

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      # Automated emulator boot check: verifies the release APK installs and launches on a clean
      # Android environment, AND — via the app's own logcat traces — that cold start completes:
      #   * "[hallyu:boot] index:redirect" must appear (splash left, landed on welcome/tabs),
      #   * "[hallyu:crash]" (the global trap firing) or "Attempted to navigate" or
      #     "index:nav-failed" must NOT appear (a swallowed JS error = failed build, no more
      #     green-with-errors-underneath),
      #   * no FATAL EXCEPTION / ANR.
      # Hard gate (no continue-on-error): if this step is red, the APK is broken. Period.
      - name: Verify release APK boot on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # POSIX sh ONLY. This action executes the script as `/usr/bin/sh -e ...` (dash, with
            # -e IMPOSED externally). Hard-won rules from runs 36138512922 / 36139864397 /
            # 36141310662:
            #   * no bashisms — 'set -o pipefail' once killed every run on line 1 (exit 2);
            #   * $GITHUB_WORKSPACE is EMPTY in this context — run 3 proved it ("start OUT="),
            #     so paths built from it became nonexistent "/android/..." — locate the APK
            #     with find instead and derive the workspace from its real path;
            #   * -e is imposed by the action — EVERY fallible command must use the guarded
            #     'cmd || rc=$?' form, never a bare command, or the script dies mid-check
            #     (run 3 died at a plain 'ls' with exit 2).
            set -u
            note() { echo "::notice::[boot-check] $*"; }

            APK=$(find /home/runner/work -type f -name app-release.apk -path "*/outputs/apk/release/*" 2>/dev/null | head -1) || APK=""
            note "apk-locate found=${APK:+yes}"
            if [ -z "$APK" ]; then
              echo "::error::[boot-check] could not locate app-release.apk under /home/runner/work — falling back to cwd-relative path"
              APK="android/app/build/outputs/apk/release/app-release.apk"
            fi
            case "$APK" in
              /*) OUT=$(echo "$APK" | sed 's|/android/app/build.*||') ;;
              *) OUT="." ;;
            esac
            note "workspace-derived len=$(echo "$OUT" | wc -c)"

            rc=0; adb devices || rc=$?; note "stage=adb-devices exit=$rc"

            FAILED=0
            rc=0; adb install -r "$APK" || rc=$?; note "stage=install exit=$rc"
            if [ "$rc" != "0" ]; then echo "::error::[boot-check] adb install failed exit=$rc"; FAILED=1; fi

            rc=0; adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done' || rc=$?; note "stage=boot-wait exit=$rc"

            rc=0; adb logcat -c || rc=$?; note "stage=logcat-clear exit=$rc"

            rc=0; adb shell am start -n com.hallyu.app/.MainActivity || rc=$?; note "stage=am-start exit=$rc"
            if [ "$rc" != "0" ]; then echo "::error::[boot-check] am start failed exit=$rc"; FAILED=1; fi

            # Poll for the app's own boot marker: cold start must leave the splash and redirect
            # within ~48s (designed worst case: font gate 1.2s + auth ceiling 1.6s + bailout 6s).
            FOUND=""
            i=0
            while [ "$i" -lt 24 ]; do
              sleep 2
              i=$((i+1))
              # NOTE: the real line is "[hallyu:boot] +<N>ms index:redirect..." — the pattern
              # must tolerate the elapsed-time field between prefix and phase.
              if adb logcat -d 2>/dev/null | grep -q "\[hallyu:boot\].*index:redirect"; then FOUND="yes"; break; fi
            done
            note "stage=poll polls=$i found=${FOUND:-no}"

            rc=0; adb logcat -d > "$OUT/logcat-full.txt" 2>/dev/null || rc=$?; note "stage=capture-full exit=$rc"
            rc=0; adb logcat -d "*:E" > "$OUT/logcat-errors.txt" 2>/dev/null || rc=$?
            rc=0; adb logcat -d 2>/dev/null | grep "\[hallyu:boot\]" > "$OUT/logcat-boot-trail.txt" || rc=$?
            rc=0; ls -l "$OUT"/logcat-*.txt || rc=$?; note "stage=capture exit=$rc"

            echo "=== BOOT TRAIL ==="
            cat "$OUT/logcat-boot-trail.txt" 2>/dev/null || true
            echo "=== LOGCAT ERRORS (*:E) ==="
            cat "$OUT/logcat-errors.txt" 2>/dev/null || true
            echo "==========================="

            if grep -E "FATAL EXCEPTION|ANR in" "$OUT/logcat-full.txt" 2>/dev/null; then
              echo "::error::[boot-check] FATAL EXCEPTION or ANR during launch window"
              grep -E "FATAL EXCEPTION.*|ANR in.*" "$OUT/logcat-full.txt" 2>/dev/null | head -4 | while IFS= read -r l; do echo "::error::[fatal-line] $l"; done
              FAILED=1
            fi
            if grep -E "\[hallyu:crash\]|Attempted to navigate before mounting|index:nav-failed" "$OUT/logcat-full.txt" 2>/dev/null; then
              echo "::error::[boot-check] swallowed JS error during launch — crash trap fired or navigation failed"
              grep -E "\[hallyu:crash\].*|Attempted to navigate.*|index:nav-failed.*" "$OUT/logcat-full.txt" 2>/dev/null | head -6 | while IFS= read -r l; do echo "::error::[crash-line] $l"; done
              FAILED=1
            fi
            if [ -z "$FOUND" ]; then
              echo "::error::[boot-check] cold start never reached [hallyu:boot] index:redirect within ~48s"
              tail -12 "$OUT/logcat-boot-trail.txt" 2>/dev/null | while IFS= read -r l; do echo "::error::[boot-trail] $l"; done
              FAILED=1
            fi
            if [ "$FAILED" != "0" ]; then exit 1; fi
            note "PASSED — reached redirect, no JS crash, no FATAL/ANR"

      - name: Upload emulator boot logcat artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logcat
          path: |
            logcat-errors.txt
            logcat-full.txt
            logcat-boot-trail.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Print Gradle diagnostics on failure
        if: failure()
        working-directory: android
        run: |
          echo "Gradle version:"
          ./gradlew --version || true

          echo "Generated Android configuration:"
          grep -RInE \
            "compileSdk|targetSdk|minSdk|ndkVersion|buildToolsVersion" \
            . \
            --exclude-dir=.gradle \
            --exclude='*.lock' || true

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed || true

      - name: Prepare artifact
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk hallyu.apk
          ls -lh hallyu.apk
          echo "APK_SIZE=$(du -h hallyu.apk | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-apk
          path: hallyu.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="apk-${{ github.run_number }}"

          gh release create "$TAG" hallyu.apk \
            --title "Hallyu APK #${{ github.run_number }}" \
            --notes "Installable Android APK (${APK_SIZE}).

          Connected to live Supabase backend via constants/keys.ts.

          Install: download APK → allow unknown apps → open file."
