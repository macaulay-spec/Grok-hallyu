name: Build APK

# Installable Android APK. Client credentials (Supabase + TMDB) are wired in
# constants/keys.ts, so the build talks to the real backend with no extra env.

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # needed to publish the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      # Gradle cache must come AFTER prebuild, since android/ is generated
      # (gitignored) and doesn't exist at checkout time.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The Expo SDK 51 template signs release builds with the debug keystore
      # by default (verified in android/app/build.gradle), so assembleRelease
      # yields a directly installable APK with no keystore setup needed.
      - name: Build APK (release, debug-signed → installable)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        # Catalog + Supabase client credentials are wired in constants/keys.ts. Do not inject
        # EXPO_PUBLIC_TMDB_* from missing secrets here: an empty value would be inlined as ''.

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk hallyu-demo.apk
          echo "APK_SIZE=$(du -h hallyu-demo.apk | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-demo-apk
          path: hallyu-demo.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" hallyu-demo.apk \
            --title "Hallyu APK #${{ github.run_number }}" \
            --notes "Installable build (${APK_SIZE}), wired to the live backend via constants/keys.ts.

          Install: download the APK on your Android phone, allow 'install unknown apps' for your browser, then open it."
