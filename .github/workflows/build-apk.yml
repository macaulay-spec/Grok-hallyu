name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths-ignore:
      - "supabase/**"
      - "docs/**"
      - "*.md"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      # Expo SDK 51 / React Native 0.74 compatible NDK.
      ANDROID_NDK_VERSION: "26.1.10909125"
      # Optional build-time overrides for the backend endpoints. Empty secrets are ignored by
      # constants/keys.ts (which keeps its built-in defaults), so the APK still connects to the
      # live backend when these are unset. Backend #3 keys are deliberately NOT injected here.
      EXPO_PUBLIC_HALYU_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_HALYU_SUPABASE_URL }}
      EXPO_PUBLIC_HALYU_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_HALYU_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_TMDB_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_ACCESS_TOKEN }}
      EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
      # Backend #3 (video fallback): when these secrets are set, video uploads automatically
      # redirect to that project whenever Backend #2 is exhausted or unavailable
      # (lib/video.ts). Unset → the app behaves exactly as before, Backend #2 only.
      EXPO_PUBLIC_BACKEND_3_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_3_URL }}
      EXPO_PUBLIC_BACKEND_3_ANON_KEY: ${{ secrets.EXPO_PUBLIC_BACKEND_3_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: setup-android splits `packages` on SPACES, not newlines.
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f "google-services.json" ]; then
            echo "Creating fallback google-services.json for build runner..."
            cat << 'EOF' > google-services.json
          {
            "project_info": {
              "project_number": "490855512954",
              "project_id": "zesty-structure-gcf5x",
              "storage_bucket": "zesty-structure-gcf5x.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:490855512954:android:2b71d71e9384902007b4c3",
                  "android_client_info": {
                    "package_name": "com.hallyu.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "490855512954-au8e3sco0ru4ptuquadt5qp9ua9flppm.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDq1QdyEMJj6u50LpLbjpgkkOPMOAdeboM"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify generated Android project
        run: |
          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/build.gradle

      - name: Show Android tool versions
        working-directory: android
        run: |
          ./gradlew --version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls -la "$ANDROID_SDK_ROOT/ndk" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4g
            -Dorg.gradle.daemon=false
            -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all

          test -f app/build/outputs/apk/release/app-release.apk

      # Fail the build here — before the APK is uploaded or released — if it would not install or
      # launch cleanly. Catches the classic release-APK regressions: an unaligned zip (INSTALL_FAILED),
      # a missing/broken signature (Android 7+ requires v2), and a missing JS bundle (white screen on
      # launch). Uses the build-tools that were installed above; nothing here touches signing keys.
      - name: Verify release APK (install-safety)
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BT="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

          echo "— zipalign (4-byte) —"
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          echo "zipalign: OK"

          echo "— signature (v1 + v2) —"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -3

          echo "— embedded JS bundle —"
          unzip -l "$APK" | grep -q "assets/index.android.bundle" || {
            echo "::error::assets/index.android.bundle missing — the app would white-screen on launch."
            exit 1
          }
          echo "JS bundle: present"

          echo "— manifest sanity (package / sdk / launcher) —"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|launchable-activity" | head -6

          echo "APK install-safety verification passed."

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      # Automated emulator boot check: verifies the release APK installs and launches on a clean Android environment
      # without crashing or ANRing before or during JavaScript initialization.
      - name: Verify release APK boot on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK="android/app/build/outputs/apk/release/app-release.apk"
            echo "Installing release APK: $APK"
            adb install -r "$APK"

            echo "Clearing logcat buffer..."
            adb logcat -c

            echo "Launching app (com.hallyu.app/.MainActivity)..."
            adb shell am start -n com.hallyu.app/.MainActivity

            echo "Waiting 15 seconds for startup window..."
            sleep 15

            echo "Capturing logcat errors (*:E) and full logcat..."
            adb logcat -d *:E > logcat-errors.txt || true
            adb logcat -d > logcat-full.txt || true

            echo "=== LOGCAT ERRORS (*:E) ==="
            cat logcat-errors.txt || true
            echo "==========================="

            echo "Checking for FATAL EXCEPTION or ANR..."
            if grep -E "FATAL EXCEPTION|ANR in" logcat-full.txt; then
              echo "::error::Detected FATAL EXCEPTION or ANR during launch window!"
              grep -C 5 -E "FATAL EXCEPTION|ANR in" logcat-full.txt
              exit 1
            fi

            echo "Emulator boot check passed: No FATAL EXCEPTION or ANR detected."

      - name: Upload emulator boot logcat artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logcat
          path: |
            logcat-errors.txt
            logcat-full.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Print Gradle diagnostics on failure
        if: failure()
        working-directory: android
        run: |
          echo "Gradle version:"
          ./gradlew --version || true

          echo "Generated Android configuration:"
          grep -RInE \
            "compileSdk|targetSdk|minSdk|ndkVersion|buildToolsVersion" \
            . \
            --exclude-dir=.gradle \
            --exclude='*.lock' || true

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed || true

      - name: Prepare artifact
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk hallyu.apk
          ls -lh hallyu.apk
          echo "APK_SIZE=$(du -h hallyu.apk | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-apk
          path: hallyu.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="apk-${{ github.run_number }}"

          gh release create "$TAG" hallyu.apk \
            --title "Hallyu APK #${{ github.run_number }}" \
            --notes "Installable Android APK (${APK_SIZE}).

          Connected to live Supabase backend via constants/keys.ts.

          Install: download APK → allow unknown apps → open file."
