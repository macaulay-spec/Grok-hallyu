name: Build demo APK

# Frontend-only demo build: no Supabase env vars are provided, so the app
# auto-detects DEMO_MODE (see src/lib/demo.ts) and runs entirely offline
# against in-memory demo data. No backend is contacted.

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # needed to publish the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (Temurin 17 + Gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      # The Expo SDK 51 template signs release builds with the debug keystore
      # by default (verified in android/app/build.gradle), so assembleRelease
      # yields a directly installable APK with no keystore setup needed.
      - name: Build APK (release, debug-signed → installable)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk hallyu-demo.apk
          echo "APK_SIZE=$(du -h hallyu-demo.apk | cut -f1)" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-demo-apk
          path: hallyu-demo.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" hallyu-demo.apk \
            --title "Hallyu demo APK #${{ github.run_number }}" \
            --notes "Frontend-only demo build (${APK_SIZE}). No Supabase backend — runs fully offline in demo mode.

          Install: download the APK on your Android phone, allow 'install unknown apps' for your browser, then open it."
